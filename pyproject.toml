[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beeghost"
version = "0.1.0"
description = "Social media automation toolkit"
requires-python = ">=3.10"

[project.scripts]
beeghost = "BeeGhost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]